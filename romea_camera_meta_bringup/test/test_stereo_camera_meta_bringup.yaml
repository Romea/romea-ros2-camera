name: "camera"
namespace: "ns"
launch:
  - include:
      file: "$(find-pkg-share romea_camera_meta_bringup)/profile/zed-ros2-wrapper.launch.py"
      arg:
        - name: device
          value: /dev/video0
configuration:
  manufacturer: stereolabs
  model: zed
  version: "1"
  frame_rate: 30 # hz
  resolution: 1280x720 # width x height
location:
  parent_link: "base_link"
  xyz: [1.0, 2.0, 3.0] # meters
  rpy: [4.0, 5.0, 6.0] # degrees
records:
  camera_info: false
  image_raw: true
