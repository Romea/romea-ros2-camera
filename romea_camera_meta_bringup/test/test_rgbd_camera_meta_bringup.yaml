name: "camera"
namespace: "ns"
launch:
  - include:
      file: "$(find-pkg-share romea_camera_meta_bringup)/profile/realsense2_camera.launch.py"
      arg:
        - name: device
          value: /dev/video0
configuration:
  manufacturer: intel
  model: realsense
  version: d435
  rgb_camera:
    frame_rate: 15 # hz
    resolution: 640x480 # width x height
  depth_camera:
    frame_rate: 30 # hz
    resolution: 640x480 # width x height
  infrared_camera:
    frame_rate: 60 # hz
    resolution: 640x480 # width x height
location:
  parent_link: "base_link"
  xyz: [1.0, 2.0, 3.0] # meters
  rpy: [4.0, 5.0, 6.0] # degrees
records:
  camera_info: false
  image_raw: true
