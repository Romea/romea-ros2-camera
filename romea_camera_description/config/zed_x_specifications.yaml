type: stereo
image_format: yuyv
brightness: #OK
    default: 4
    range: [0, 8]
    step: 1
contrast: #OK
    default: 4
    range: [0, 8]
    step: 1
hue: #OK
    default: 0
    range: [0, 11]
    step: 1
saturation: #OK
    default: 4
    range: [0, 8]
    step: 1
sharpness: #OK
    default: 4
    range: [0, 8]
    step: 1
gamma: #Not OK usb_cam between [1-500]
    default: 8
    range: [0, 8]
    step: 1
gain: #Not Ok usb_cam between [0-8]
    default: 100
    range: [0, 100]
    step: 1
exposure: #OK not suppoted by usb_cam
    default: 100
    range: [0, 100]
    step: 1
whitebalance_temperature: #OK but for ZED ros wrapper in [28,65]
    default: 4200
    range: [2800, 6500]
auto_exposure_gain: #Ok but not supported in usb cam
    default: True
    list: [True, False]
auto_whitebalance: #OK
    default: True
    list: [True, False]
video_format: #OK
    default: h264
    list: [h264, h265]
# v4l2-ctl --device=/dev/video4 -L
# User Controls

#                      brightness 0x00980900 (int)    : min=0 max=8 step=1 default=4 value=4
#                        contrast 0x00980901 (int)    : min=0 max=8 step=1 default=4 value=4
#                      saturation 0x00980902 (int)    : min=0 max=8 step=1 default=4 value=4
#                             hue 0x00980903 (int)    : min=0 max=11 step=1 default=0 value=0 flags=inactive
#         white_balance_automatic 0x0098090c (bool)   : default=1 value=1
#                     red_balance 0x0098090e (int)    : min=1024 max=4095 step=16 default=1024 value=1024 flags=inactive
#                    blue_balance 0x0098090f (int)    : min=1024 max=4095 step=16 default=1024 value=1024 flags=inactive
#                           gamma 0x00980910 (int)    : min=1 max=500 step=1 default=100 value=100
#                            gain 0x00980913 (int)    : min=0 max=8 step=1 default=4 value=4
#            power_line_frequency 0x00980918 (menu)   : min=0 max=2 default=1 value=1 (50 Hz)
