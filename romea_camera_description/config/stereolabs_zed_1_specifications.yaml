type:
  default: stereo_camera
  list: [stereo_camera, rgbd_stereo_camera]
resolution:
  default: 1280x720
  list: [2208x1242, 1920x1080, 1280x720, 672x376]
horizontal_fov:
  depend: resolution
  dict:
    2208x1242: 76.0
    1920x1080: 69.0
    1280x720: 85.0
    672x376: 85.0
frame_rate:
  depend: resolution
  dict:
    2208x1242: 15
    1920x1080:
      default: 30
      list: [15, 30]
    1280x720:
      default: 30
      list: [15, 30, 60]
    672x376:
      default: 30
      list: [15, 30, 60, 100]
image_format: yuyv
video_format:
  default: h264
  list: [h264, h265]
